<div class="preview-bar" role="note">
  <div class="preview-bar-text">
    <strong>Attendee view</strong>
    <span>This is the event page as attendees see it. Registration is disabled in this preview.</span>
  </div>
  <div class="preview-bar-actions">
    @if (canEdit()) {
      <a class="preview-link" routerLink="../settings">Edit details &amp; program</a>
    }
    <a class="preview-link" [routerLink]="['/events', eventId()]" target="_blank" rel="noopener">Open public page</a>
  </div>
</div>

@if (eventId()) {
  <app-event-details [previewEventId]="eventId()" />
}
