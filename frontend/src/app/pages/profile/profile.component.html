<main class="profile-page">
  <section class="profile-card" aria-labelledby="profile-title">
    @if (auth.isAuthenticated()) {
      <div class="profile-avatar" aria-hidden="true">
        {{ auth.user()?.fullName?.charAt(0) }}
      </div>
      <p class="eyebrow">Your account</p>
      <h1 id="profile-title">Welcome, {{ auth.user()?.fullName }}</h1>
      <p class="profile-email">{{ auth.user()?.email }}</p>
      <button class="profile-button secondary-button" type="button" (click)="auth.logout()">
        Log out
      </button>
    } @else {
      <div class="profile-avatar guest-avatar" aria-hidden="true">?</div>
      <p class="eyebrow">Your account</p>
      <h1 id="profile-title">Your profile is waiting</h1>
      <p class="profile-message">
        You’re not signed in yet. Log in to access your profile and account details.
      </p>
      <a class="profile-button login-button" routerLink="/login">Go to log in</a>
    }
  </section>
</main>
