<header class="public-navbar">
  <div class="navbar-container">
    <a routerLink="/events" class="brand-link" aria-label="Checkpoint Home">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7" rx="2"></rect>
        <rect x="14" y="3" width="7" height="7" rx="2"></rect>
        <rect x="14" y="14" width="7" height="7" rx="2"></rect>
        <rect x="3" y="14" width="7" height="7" rx="2"></rect>
      </svg>
      <span class="brand-name">checkpoint</span>
    </a>

    <div class="navbar-actions">
      <a routerLink="/admin/dashboard" class="nav-history-link">Admin Console</a>
      <a routerLink="/profile" class="user-pill" aria-label="View user profile">
        <span class="user-avatar" aria-hidden="true">{{ auth.user()?.fullName?.charAt(0) || 'U' }}</span>
        <span class="user-name">{{ auth.user()?.fullName }}</span>
      </a>
      <button
        type="button"
        class="btn-quick-logout"
        (click)="onQuickLogout()"
        aria-label="Sign out"
        title="Sign out of Checkpoint"
      >
        <svg class="logout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span class="logout-text">Sign out</span>
      </button>
    </div>
  </div>
</header>
